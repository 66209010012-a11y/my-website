    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
        }

        body {
            overflow-x: hidden;
            background: #07111c;
        }


        /* =================================
           LOADER
        ================================= */

/* =================================
   RESPONSIVE LOADER
================================= */

#loader {
    position: fixed;
    inset: 0;

    width: 100%;
    height: 100%;
    height: 100dvh;

    overflow: hidden;

    z-index: 99999;

    background: #07111c;

    opacity: 1;
    transform: scale(1);

    transition:
        opacity 1.2s cubic-bezier(0.22, 1, 0.36, 1),
        transform 1.4s cubic-bezier(0.22, 1, 0.36, 1),
        filter 1.2s cubic-bezier(0.22, 1, 0.36, 1);
}


/* =================================
   LOADER IMAGE
================================= */

#loader img {
    position: absolute;
    inset: 0;

    width: 100%;
    height: 100%;
    height: 100dvh;

    display: block;

    object-fit: cover;
    object-position: center center;

    transform: scale(1);

    transition:
        transform 1.6s cubic-bezier(0.22, 1, 0.36, 1),
        filter 1.2s ease;
}


/* =================================
   LOADER HIDE
================================= */

#loader.hide {
    opacity: 0;
    transform: scale(1.08);
    filter: blur(12px);

    pointer-events: none;
}

#loader.hide img {
    transform: scale(1.12);
    filter: blur(4px);
}


/* =================================
   LOADING TEXT
================================= */

.loading-text {
    position: absolute;

    left: 50%;
    bottom: clamp(180px, 28vh, 320px);

    transform: translateX(-50%);

    /* สำคัญ */
    width: max-content;
    max-width: 95vw;

    padding:
        clamp(9px, 1.2vw, 16px)
        clamp(14px, 2vw, 30px);

    color: rgba(255, 255, 255, 0.95);

    font-family: Arial, sans-serif;

    font-size: clamp(18px, 3vw, 48px);

    font-weight: 500;

    letter-spacing: clamp(1px, 0.35vw, 4px);

    line-height: 1.25;

    text-align: center;

    /* สำคัญ */
    white-space: nowrap;

    background: rgba(255, 255, 255, 0.10);

    border:
        1px solid rgba(255, 255, 255, 0.20);

    border-radius: 999px;

    backdrop-filter:
        blur(12px)
        saturate(140%);

    -webkit-backdrop-filter:
        blur(12px)
        saturate(140%);

    text-shadow:
        0 2px 8px rgba(0, 0, 0, 0.8),
        0 0 20px rgba(0, 0, 0, 0.5);

    box-shadow:
        0 8px 30px rgba(0, 0, 0, 0.2),
        inset 0 1px 1px rgba(255, 255, 255, 0.25);

    opacity: 0;

    animation:
        welcomeText
        1.5s
        cubic-bezier(0.22, 1, 0.36, 1)
        0.4s
        forwards;
}


/* =================================
   LOADING CIRCLE
================================= */

.glass-loader {
    position: absolute;

    left: 50%;

    /*
       ไม่ใช้ bottom แบบค่าตายตัว
       อิงจากตำแหน่งข้อความ
    */
    bottom: clamp(90px, 17vh, 190px);

    width: clamp(45px, 5vw, 62px);
    height: clamp(45px, 5vw, 62px);

    transform: translateX(-50%);

    display: flex;

    justify-content: center;
    align-items: center;

    border-radius: 50%;

    background:
        rgba(255, 255, 255, 0.10);

    border:
        1px solid rgba(255, 255, 255, 0.25);

    backdrop-filter:
        blur(15px)
        saturate(160%);

    -webkit-backdrop-filter:
        blur(15px)
        saturate(160%);

    box-shadow:
        0 8px 30px rgba(0, 0, 0, 0.25),
        inset 0 1px 2px rgba(255, 255, 255, 0.35);

    opacity: 0;

    animation:
        glassLoaderAppear
        1.2s
        cubic-bezier(0.22, 1, 0.36, 1)
        0.6s
        forwards;
}


.glass-loader::before {
    content: "";

    width: 70%;
    height: 70%;

    border-radius: 50%;

    background:
        conic-gradient(
            from 0deg,
            transparent 0deg,
            rgba(255,255,255,0.15) 80deg,
            rgba(255,255,255,0.95) 140deg,
            transparent 200deg
        );

    -webkit-mask:
        radial-gradient(
            farthest-side,
            transparent calc(100% - 3px),
            #000 calc(100% - 2px)
        );

    mask:
        radial-gradient(
            farthest-side,
            transparent calc(100% - 3px),
            #000 calc(100% - 2px)
        );

    animation:
        liquidSpin 1s linear infinite;

    filter:
        drop-shadow(
            0 0 6px
            rgba(255,255,255,0.7)
        );
}


/* =================================
   WELCOME TEXT ANIMATION
================================= */

@keyframes welcomeText {

    from {
        opacity: 0;

        transform:
            translate(-50%, 25px);

        filter: blur(8px);
    }

    to {
        opacity: 1;

        transform:
            translate(-50%, 0);

        filter: blur(0);
    }
}




        @keyframes glassLoaderAppear {

            from {

                opacity: 0;

                transform:
                    translateX(-50%)
                    translateY(35px)
                    scale(0.75);

                filter: blur(8px);
            }

            to {

                opacity: 1;

                transform:
                    translateX(-50%)
                    translateY(0)
                    scale(1);

                filter: blur(0);
            }
        }


        @keyframes liquidSpin {

            to {
                transform: rotate(360deg);
            }
        }


        #loader.hide .glass-loader {

            opacity: 0;

            transform:
                translateX(-50%)
                translateY(-20px)
                scale(0.8);

            filter: blur(8px);

            transition:
                opacity 0.7s ease,
                transform 0.9s cubic-bezier(0.22, 1, 0.36, 1),
                filter 0.7s ease;
        }


        #loader.hide .loading-text {

            opacity: 0;

            transform:
                translate(-50%, -20px);

            filter: blur(8px);

            transition:
                opacity 0.7s ease,
                transform 0.9s cubic-bezier(0.22, 1, 0.36, 1),
                filter 0.7s ease;
        }


        /* =================================
           360 VIEWER
        ================================= */

        #viewer360 {

            position: fixed;

            inset: 0;

            z-index: 100000;

            background: #050b12;

            opacity: 0;

            visibility: hidden;

            transform: scale(1.05);

            filter: blur(10px);

            transition:
                opacity 1s cubic-bezier(0.22, 1, 0.36, 1),
                transform 1.2s cubic-bezier(0.22, 1, 0.36, 1),
                filter 1s ease,
                visibility 0s linear 1s;
        }


        #viewer360.active {

            opacity: 1;

            visibility: visible;

            transform: scale(1);

            filter: blur(0);

            transition:
                opacity 1s cubic-bezier(0.22, 1, 0.36, 1),
                transform 1.2s cubic-bezier(0.22, 1, 0.36, 1),
                filter 1s ease;
        }


        #panorama {

            position: absolute;

            inset: 0;

            width: 100%;
            height: 100%;

            cursor: grab;

            touch-action: none;
        }


        #panorama:active {

            cursor: grabbing;
        }


        /* =================================
           360 TOP BAR
        ================================= */

        .viewer-top {

            position: absolute;

            top: 25px;
            left: 25px;
            right: 25px;

            z-index: 10;

            display: flex;

            justify-content: space-between;

            align-items: center;

            color: white;

            font-family: Arial, sans-serif;

            font-size: 16px;

            letter-spacing: 3px;

            pointer-events: none;
        }


        /* =================================
           CLOSE BUTTON
        ================================= */

        #close360 {

            pointer-events: auto;

            width: 50px;
            height: 50px;

            border:
                1px solid
                rgba(255,255,255,.25);

            border-radius: 50%;

            background:
                rgba(255,255,255,.10);

            backdrop-filter: blur(15px);

            color: white;

            font-size: 30px;

            cursor: pointer;

            transition:
                transform .3s ease,
                background .3s ease;
        }


        #close360:hover {

            transform:
                rotate(90deg)
                scale(1.1);

            background:
                rgba(255,255,255,.2);
        }


        /* =================================
           HINT
        ================================= */

        .viewer-hint {

            position: absolute;

            bottom: 35px;
            left: 50%;

            transform: translateX(-50%);

            padding: 12px 22px;

            color: white;

            background:
                rgba(255,255,255,.10);

            border:
                1px solid
                rgba(255,255,255,.2);

            border-radius: 999px;

            backdrop-filter: blur(12px);

            font-family: Arial, sans-serif;

            font-size: 14px;

            pointer-events: none;

            white-space: nowrap;
        }


        /* =================================
           MOBILE
        ================================= */

        @media (max-width: 480px) {

    .loading-text {

        width: max-content;

        max-width: 95vw;

        font-size: clamp(16px, 5vw, 23px);

        letter-spacing: 1px;

        padding: 10px 16px;

        border-radius: 25px;

        bottom: 25vh;
        }

        .glass-loader {
            bottom: 14vh;

            width: 48px;
            height: 48px;
        }
    }

   360 NAVIGATION HOTSPOT

/* =================================
   360 NAVIGATION HOTSPOT
================================= */

.hotspot {
    position: absolute;

    width: 58px;
    height: 58px;

    border-radius: 50%;

    border: 1px solid rgba(255,255,255,.45);

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.22),
            rgba(255,255,255,.06)
        );

    backdrop-filter:
        blur(15px)
        saturate(160%);

    -webkit-backdrop-filter:
        blur(15px)
        saturate(160%);

    color: white;

    display: flex;
    align-items: center;
    justify-content: center;

    cursor: pointer;

    z-index: 20;

    box-shadow:
        0 8px 30px rgba(0,0,0,.25),
        inset 0 1px 2px rgba(255,255,255,.45),
        0 0 25px rgba(255,255,255,.15);

    transform:
        translate(-50%, -50%);

    transition:
        transform .35s cubic-bezier(.22,1,.36,1),
        background .35s ease,
        box-shadow .35s ease;
}

/* =================================
   INFO HOTSPOT
   ปุ่มข้อมูลสถานที่
================================= */

.info-hotspot {
    position: absolute;

    width: 46px;
    height: 46px;

    border-radius: 14px;

    border: 1px solid rgba(255,255,255,.35);

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.20),
            rgba(255,255,255,.06)
        );

    backdrop-filter: blur(15px);
    -webkit-backdrop-filter: blur(15px);

    color: white;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 20px;
    font-weight: 500;

    cursor: pointer;

    z-index: 25;

    transform: translate(-50%, -50%);

    box-shadow:
        0 8px 30px rgba(0,0,0,.25),
        inset 0 1px 2px rgba(255,255,255,.4);

    transition:
        transform .35s cubic-bezier(.22,1,.36,1),
        background .35s ease,
        box-shadow .35s ease;
}


/* ไอคอนด้านใน */
.info-hotspot::before {
    content: "✦";

    font-size: 18px;

    filter:
        drop-shadow(
            0 0 6px
            rgba(255,255,255,.7)
        );

    transition:
        transform .35s ease;
}


/* วงแหวนด้านใน */
.info-hotspot::after {
    content: "";

    position: absolute;

    inset: 6px;

    border-radius: 10px;

    border:
        1px solid
        rgba(255,255,255,.18);

    transition:
        transform .35s ease,
        opacity .35s ease;
}


/* Hover */
.info-hotspot:hover {
    transform:
        translate(-50%, -50%)
        scale(1.15);

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.32),
            rgba(255,255,255,.12)
        );

    box-shadow:
        0 12px 40px rgba(0,0,0,.3),
        inset 0 1px 3px rgba(255,255,255,.55),
        0 0 30px rgba(255,255,255,.25);
}


.info-hotspot:hover::before {
    transform:
        rotate(90deg)
        scale(1.15);
}


/* ตอนกด */
.info-hotspot:active {
    transform:
        translate(-50%, -50%)
        scale(.9);
}


/* Animation */
@keyframes infoHotspotPulse {

    0% {
        box-shadow:
            0 0 0 0
            rgba(255,255,255,.25);
    }

    70% {
        box-shadow:
            0 0 0 14px
            rgba(255,255,255,0);
    }

    100% {
        box-shadow:
            0 0 0 0
            rgba(255,255,255,0);
    }
}


.info-hotspot {
    animation:
        infoHotspotPulse 2.5s infinite;
}


/* ลูกศร */
.hotspot::before {
    content: "";

    width: 14px;
    height: 14px;

    border-top: 2px solid white;
    border-right: 2px solid white;

    transform: rotate(45deg);

    filter:
        drop-shadow(0 0 5px rgba(255,255,255,.7));

    transition:
        transform .35s cubic-bezier(.22,1,.36,1);
}


/* วงแหวนด้านนอก */
.hotspot::after {
    content: "";

    position: absolute;

    inset: 7px;

    border-radius: 50%;

    border: 1px solid rgba(255,255,255,.18);

    transition:
        transform .4s ease,
        opacity .4s ease;
}


/* Hover */
.hotspot:hover {

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.35),
            rgba(255,255,255,.12)
        );

    transform:
        translate(-50%, -50%)
        scale(1.15);

    box-shadow:
        0 12px 40px rgba(0,0,0,.3),
        inset 0 1px 3px rgba(255,255,255,.55),
        0 0 35px rgba(255,255,255,.35);
}


.hotspot:hover::before {
    transform:
        rotate(45deg)
        translate(3px, -3px);
}


.hotspot:hover::after {
    transform: scale(1.15);
    opacity: .5;
}


/* ตอนกด */
.hotspot:active {
    transform:
        translate(-50%, -50%)
        scale(.9);
}


/* Pulse */
@keyframes hotspotPulse {

    0% {
        box-shadow:
            0 0 0 0 rgba(255,255,255,.35);
    }

    70% {
        box-shadow:
            0 0 0 18px rgba(255,255,255,0);
    }

    100% {
        box-shadow:
            0 0 0 0 rgba(255,255,255,0);
    }
}

.hotspot {
    animation:
        hotspotPulse 2.5s infinite;
}

function formatTime(seconds) {

    if (isNaN(seconds)) {
        return "0:00";
    }

    const minutes =
        Math.floor(seconds / 60);

    const secs =
        Math.floor(seconds % 60);

    return minutes + ":" +
        String(secs).padStart(2, "0");
}

function getCurrentInfoSound() {

    if (currentInfoType === "temple") {

        }

    return stairsSoundTH;
}

function updateAudioTime() {

    getCurrentInfoSound();

    if (!audio.duration) {

    const percent =
        (audio.currentTime / audio.duration) * 100;

    audioProgress.value = percent;

    audioCurrentTime.textContent =
        formatTime(audio.currentTime);

    audioDuration.textContent =
        formatTime(audio.duration);
}

        /*del360*/
        function cleanup360() {

    hotspots.forEach(h => {
        h.element.remove();
    });

    hotspots = [];

    if (sphere) {

        scene.remove(sphere);

        if (sphere.geometry) {
            sphere.geometry.dispose();
        }

        if (sphere.material) {

            if (sphere.material.map) {
                sphere.material.map.dispose();
            }

            sphere.material.dispose();
        }

        sphere = null;
    }

    if (renderer) {

        renderer.dispose();

        renderer.domElement.remove();

        renderer = null;
    }

    scene = null;
    camera = null;
}



        /* =================================
           OPEN 360
        ================================= */

        function open360(imagePath, startRotation = 0) {
        
        cleanup360();

        rotationX = startRotation;
        rotationY = 0;

        hotspots = [];

            viewer.classList.add("active");

            panorama.innerHTML = "";

            scene =
                new THREE.Scene();


            camera =
                new THREE.PerspectiveCamera(
                    75,
                    window.innerWidth /
                    window.innerHeight,
                    1,
                    2000
                );


            camera.position.set(
                0,
                0,
                0.1
            );


            renderer =
                new THREE.WebGLRenderer({
                    antialias: true
                });


            renderer.setPixelRatio(
            Math.min(window.devicePixelRatio, 1.5)
            );


            renderer.setSize(
                window.innerWidth,
                window.innerHeight
            );


            panorama.appendChild(
                renderer.domElement
            );

            renderer.domElement.style.position = "absolute";
            renderer.domElement.style.inset = "0";


            /* โหลดภาพ */

            const loader =
                new THREE.TextureLoader();


            loader.load(

                imagePath,

                function(texture) {

                    const geometry =
                        new THREE.SphereGeometry(
                            500,
                            48,
                            32
                        );


                    /*
                        กลับด้าน Sphere
                        เพื่อให้มองจากด้านใน
                    */

                    geometry.scale(
                        -1,
                        1,
                        1
                    );


                    const material =
                        new THREE.MeshBasicMaterial({
                            map: texture
                        });


                    sphere =
                        new THREE.Mesh(
                            geometry,
                            material
                        );


                    scene.add(
                        sphere
                    );

                    /* จุดวาร์ป */
                    if (imagePath === "panorama/stiar.jpg") {

                    // ปุ่มที่ 1
                    addHotspot(
                        "panorama/stieg.png",
                        new THREE.Vector3(100, -10, 100),
                        Math.PI * 1.2
                    );

        /*hotpot*/
        function addHotspot(targetImage, position, targetRotation = 0) {

    const button = document.createElement("button");

    button.className = "hotspot";

    button.innerHTML = "";

    button.onclick = function(e) {

        e.stopPropagation();

        open360(targetImage, targetRotation);

    };

    panorama.appendChild(button);

    hotspots.push({
        element: button,
        position: position.clone()
    });
}

function addInfoHotspot(position, type) {

        "ข้อมูลสถานที่"

                "นี่คือบันได แต่ทําไมถึงใช้พญานาค\n"+

                "Stairs of Wat Kaew Korawaram";

            infoDescription.textContent =
                "Distinctive Features of the Temple\n"+

                "Naga Motifs\n"+
                "The three sections feature detailed Naga designs. The Naga is a common symbol in Buddhist art, often found at the entrances of religious sites. It represents sacredness, dignity, and elegance.\n\n"+

        }

    }

            infoTitle.textContent =
                "พระอุโบสถ";

            infoDescription.textContent =
                "จุดเด่นของพระอุโบสถ\n"+
                "เบื้องหน้าคือพระอุโบสถสีขาวหลังใหญ่ หนึ่งในจุดเด่นด้านสถาปัตยกรรมของวัดแก้วโกรวาราม ตัวอาคารตั้งอยู่บนเนินดิน ทำให้ดูโดดเด่นและสง่างามเมื่อมองจากด้านล่าง โดยรอบมีเสาโคมไฟที่ออกแบบให้กลมกลืนกับรูปแบบของพระอุโบสถ\n"+
                "เมื่อเข้ามาภายใน สิ่งแรกที่ดึงดูดสายตาคือ พระประธานปางมารวิชัย ซึ่งประดิษฐานอยู่ภายในพระอุโบสถ สามารถหยุดชมรายละเอียดขององค์พระและบรรยากาศโดยรอบ ก่อนเดินชมจิตรกรรมฝาผนังที่อยู่โดยรอบ\n"+

                "ภาพ การประสูติของพระศาสดา ถ่ายทอดเรื่องราวการประสูติของเจ้าชายสิทธัตถะ พระราชโอรสของพระเจ้าสุทโธทนะและพระนางสิริมหามายา ณ สวนลุมพินีวัน ซึ่งถือเป็นจุดเริ่มต้นของพุทธประวัติและเส้นทางสู่การตรัสรู้\n"+
                "ส่วนภาพ พระโพธิสัตว์บนสวรรค์ชั้นดุสิต แสดงถึงช่วงเวลาก่อนที่พระโพธิสัตว์จะเสด็จลงมาประสูติเป็นเจ้าชายสิทธัตถะ ตามคติทางพระพุทธศาสนา พระองค์ประทับอยู่บนสวรรค์ชั้นดุสิต ก่อนเสด็จลงมายังโลกมนุษย์เพื่อบำเพ็ญพระบารมีและตรัสรู้เป็นพระพุทธเจ้า\n"+
                "ดังนั้น เมื่อเดินชมพระอุโบสถแห่งนี้ อย่ามองเพียงความสวยงามของสถาปัตยกรรม แต่ลองสังเกตเรื่องราวบนผนัง เพราะทุกภาพล้วนมีความหมายและช่วยให้เราเรียนรู้พุทธประวัติผ่านงานจิตรกรรมได้อย่างน่าสนใจ";

        } else {
            infoTitle.textContent =
                "inside the ordination hall";

            infoDescription.textContent =
                "In front of you is the large white ordination hall, one of the architectural highlights of Wat Kaew Korawaram. The building stands on an elevated area, making it look especially impressive and elegant when viewed from below. Around the hall, you can also notice a series of lamp posts designed to blend beautifully with the architecture.\n"+
                "As you enter the hall, the first thing that catches your attention is the large principal Buddha image in the Mara-Vijaya posture. You can take a moment to admire the details of the Buddha image and the peaceful atmosphere before looking around at the murals on the walls."+
                "The walls are covered with beautiful Buddhist paintings. These murals are not only decorative, but also tell important stories and beliefs in Buddhism. They can be seen as a visual book that allows visitors to learn about Buddhist history through art."+
                "One important mural is “Mother Earth Wringing Her Hair.” According to Buddhist tradition, before the Buddha attained enlightenment, Mara and his followers tried to disturb his meditation. Mother Earth appeared and wrung the water from her hair, representing the accumulated merit of people’s good deeds. The flowing water defeated the forces of Mara and symbolized the power of goodness and merit overcoming obstacles."+
                "Another important scene is the Birth of the Buddha, depicting the birth of Prince Siddhartha, the son of King Suddhodana and Queen Maya, at Lumbini Garden. This event marks the beginning of the Buddha’s life story and his journey toward enlightenment."+
                "You can also see the Bodhisattva in Tushita Heaven. According to Buddhist belief, before being born as Prince Siddhartha, the Bodhisattva resided in Tushita Heaven. When the time was right, he descended to the human world to fulfill his path and eventually attain enlightenment as the Buddha."+
                "As you walk around the ordination hall, take a closer look at the murals. Each painting has its own meaning and helps tell the story of Buddhism through art, making the visit more than just an appreciation of the building’s beauty.";


        }
    }


    infoModal.classList.add("active");

};

    panorama.appendChild(button);

    hotspots.push({

        element: button,

        position: position.clone()

    });
}

        /* =================================
           ANIMATION
        ================================= */

        function animate() {

    requestAnimationFrame(animate);

    if (!renderer || !scene || !camera)
        return;

    if (sphere) {
        sphere.rotation.y = rotationX;
        sphere.rotation.x = rotationY;

        sphere.updateMatrixWorld();

        updateHotspots();
    }

    renderer.render(scene, camera);
}


    /*updateteleport*/
    function updateHotspots() {

    hotspots.forEach(hotspot => {

        const vector =
            hotspot.position.clone();

        // ให้ตำแหน่ง hotspot หมุนไปพร้อมกับ Sphere
        vector.applyMatrix4(
            sphere.matrixWorld
        );

        vector.project(camera);

        const x =
            (vector.x * 0.5 + 0.5)
            * window.innerWidth;

        const y =
            (-vector.y * 0.5 + 0.5)
            * window.innerHeight;

        hotspot.element.style.left =
            x + "px";

        hotspot.element.style.top =
            y + "px";

        hotspot.element.style.display =
            vector.z < 1
                ? "flex"
                : "none";
    });
}


        /* =================================
           MOUSE
        ================================= */

        panorama.addEventListener(
            "mousedown",
            function(e) {

                isDragging = true;

                previousX =
                    e.clientX;

                previousY =
                    e.clientY;

            }
        );


        panorama.addEventListener(
            "mousemove",
            function(e) {

                if (!isDragging)
                    return;


                const deltaX =
                    e.clientX -
                    previousX;


                const deltaY =
                    e.clientY -
                    previousY;


                rotationX +=
                    deltaX * 0.005;


                rotationY +=
                    deltaY * 0.005;


                rotationY =
                    Math.max(
                        -Math.PI / 2,
                        Math.min(
                            Math.PI / 2,
                            rotationY
                        )
                    );


                previousX =
                    e.clientX;

                previousY =
                    e.clientY;

            }
        );


        window.addEventListener(
            "mouseup",
            function() {

                isDragging = false;

            }
        );



        /* =================================
           TOUCH
        ================================= */

        panorama.addEventListener(
            "touchstart",
            function(e) {

                if (
                    e.touches.length !== 1
                )
                    return;


                isDragging = true;


                previousX =
                    e.touches[0].clientX;

                previousY =
                    e.touches[0].clientY;

            }
        );


        panorama.addEventListener(
            "touchmove",
            function(e) {

                if (!isDragging)
                    return;


                const touch =
                    e.touches[0];


                const deltaX =
                    touch.clientX -
                    previousX;


                const deltaY =
                    touch.clientY -
                    previousY;


                rotationX +=
                    deltaX * 0.005;


                rotationY +=
                    deltaY * 0.005;


                rotationY =
                    Math.max(
                        -Math.PI / 2,
                        Math.min(
                            Math.PI / 2,
                            rotationY
                        )
                    );


                previousX =
                    touch.clientX;

                previousY =
                    touch.clientY;

            }
        );


        panorama.addEventListener(
            "touchend",
            function() {

                isDragging = false;

            }
        );

        /* =================================
           RESIZE
        ================================= */

        window.addEventListener(
            "resize",
            function() {

                if (
                    !camera ||
                    !renderer
                )
                    return;


                camera.aspect =
                    window.innerWidth /
                    window.innerHeight;


                camera.updateProjectionMatrix();


                renderer.setSize(
                    window.innerWidth,
                    window.innerHeight
                );

            }
        );


/* =================================
   PAGE LOADING + SOUND
================================= */

window.addEventListener(
    "load",
    () => {

        const loader =
            document.getElementById("loader");

        const mainContent =
            document.getElementById("main-content");

        const welcomeSound =
            document.getElementById("welcomeSound");


        /* ระดับเสียง */

        welcomeSound.volume = 0.1;


        /* ป้องกันการทำงานซ้ำ */

        let started = false;


        /* =================================
           START WEBSITE
        ================================= */

        function startWebsite() {

            if (started)
                return;

            started = true;


            /* เล่นเสียง */

            welcomeSound.currentTime = 0;

            welcomeSound.play().catch(error => {

                console.log(
                    "ไม่สามารถเล่นเสียงได้:",
                    error
                );

            });


            /* เริ่มเวลา Loader */

            setTimeout(
                () => {

                    mainContent.classList.add(
                        "show"
                    );


                    setTimeout(
                        () => {

                            loader.classList.add(
                                "hide"
                            );


                            setTimeout(
                                () => {

                                    open360(
                                        "panorama/stieg.png",
                                        Math.PI * 1.2
                                    );

                                },
                                1200
                            );

                        },
                        300
                    );

                },
                2000
            );
        }


        /* =================================
           CLICK LOADER
        ================================= */

        loader.addEventListener(
            "click",
            startWebsite,
            { once: true }
        );


        /* =================================
           TOUCH MOBILE
        ================================= */

        loader.addEventListener(
            "touchstart",
            startWebsite,
            { once: true }
        );


        /* =================================
           AUTO TRY
        ================================= */

        welcomeSound.play().then(() => {

            /*
                ถ้า Browser อนุญาต
                ให้เริ่มเว็บไซต์อัตโนมัติ
            */

            startWebsite();

        }).catch(() => {

            /*
                ถ้า Browser บล็อกเสียง
                รอผู้ใช้คลิก Loader
            */

            console.log(
                "กรุณาคลิกหน้าจอเพื่อเปิดเสียง"
            );

        });

    }
);
    

animate();
setLanguage("th");
